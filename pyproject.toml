[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-data-warehouse"
version = "0.1.0"
requires-python = ">=3.11"
description = "Real-time AI data warehouse — Kappa architecture (Kafka → Flink → ClickHouse)"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "utils*", "feature_store*", "batch*", "api*", "data_lake*", "pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
