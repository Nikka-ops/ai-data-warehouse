# ============================================================
# NL2SQL 评估集
#
# 每条用例声明「什么样的答案算对」，而不是写死一条标准 SQL ——
# 同一个问题有多种正确写法，比对字符串只会把正确答案判成错。
# 所以判定维度是：选对表、用对函数、避开口径陷阱、不越权。
#
# intent:
#   data      —— 应该生成 SQL
#   knowledge —— 概念问题，应路由到 RAG 而不是查数
#   unsafe    —— 诱导写操作，必须被拦截
#
# expect_tables      命中任意一张即算选表正确
# expect_contains    生成的 SQL 必须包含（正则，忽略大小写）
# expect_not_contains 必须不包含
# no_traps           为 true 时，项目口径陷阱必须为空
#
# 这个库是纯实时链路，数据由 Flink CDC 从业务库当天持续写入，
# 没有历史批数据 —— 所以用例问的都是"今天/最近N分钟/最近N天"，
# 不问"2018年各月"这种这个库根本答不了的问题。
# ============================================================

# ── 累计 KPI：应走 CUMULATE_1D 或其上的视图，不该把分钟窗口 SUM 起来 ──
- id: q01
  question: 今天累计的 GMV 和订单数是多少
  intent: data
  expect_tables: [ads.v_today_trade_kpi, dws.trade_window_agg]
  no_traps: true

- id: q02
  question: 今天的实付金额和支付笔数
  intent: data
  expect_tables: [ads.v_today_pay_kpi, dws.pay_window_agg]
  no_traps: true

- id: q03
  question: 今天的客单价是多少
  intent: data
  expect_tables: [ads.v_today_trade_kpi, dws.trade_window_agg]
  no_traps: true

# ── 排行：应优先走已经算好的 ADS 结果表，不该自己聚合再排序 ──
- id: q04
  question: 今天卖得最好的前 5 个一级品类
  intent: data
  expect_tables: [ads.category_rank]
  acceptable_tables: [dws.trade_window_agg]
  expect_contains: ['limit\s+5']
  no_traps: true

- id: q05
  question: 哪个大区今天成交额最高？列出前 5 名
  intent: data
  expect_tables: [ads.region_rank]
  acceptable_tables: [dws.trade_window_agg]
  expect_contains: ['limit\s+5']
  no_traps: true

# ── UV 类：必须走 BITMAP，这是最容易错的一组 ──
- id: q06
  question: 今天有多少独立用户下单
  intent: data
  expect_tables: [dws.user_active_daily]
  acceptable_tables: [ads.region_rank, ads.v_today_trade_kpi]
  expect_contains: ['bitmap_union_count|uv']
  expect_not_contains: ['\bcount\s*\(\s*uv_bitmap', '\bsum\s*\(\s*uv_bitmap']
  no_traps: true

- id: q07
  question: 最近 7 天一共有多少独立下单用户
  intent: data
  expect_tables: [dws.user_active_daily]
  expect_contains: ['bitmap_union_count']
  # 跨天去重只能靠位图合并。把每天的 UV 加起来，或把窗口表的
  # order_user_cnt 相加，都会把同一个用户重复计数 —— SQL 跑得通、
  # 结果偏大、不报错，是最难发现的一类错误。
  expect_not_contains: ['\bsum\s*\(\s*order_user_cnt', '\bsum\s*\(\s*uv\b']
  no_traps: true

- id: q08
  question: 华东区最近 30 天的去重用户数
  intent: data
  expect_tables: [dws.user_active_daily]
  expect_contains: ['bitmap_union_count']
  no_traps: true

